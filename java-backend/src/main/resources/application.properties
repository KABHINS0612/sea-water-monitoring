# ==============================================================================
# SEA WATER MONITORING SYSTEM - APPLICATION CONFIGURATION
# Spring Boot + Blynk IoT Cloud REST Integration
# ==============================================================================

# Server Port
server.port=8080

# Application Name
spring.application.name=sea-water-monitoring

# ==============================================================================
# BLYNK IOT CLOUD CONFIGURATION
# ==============================================================================
# Blynk Cloud Server (blynk.cloud, sgp1.blynk.cloud, fra1.blynk.cloud, etc.)
blynk.server=blynk.cloud

# Blynk Device Authentication Token
# Replace YOUR_BLYNK_AUTH_TOKEN with your actual 32-character Blynk Device Auth Token,
# or provide it via environment variable BLYNK_AUTH_TOKEN or the web dashboard settings modal.
blynk.auth-token=${BLYNK_AUTH_TOKEN:YOUR_BLYNK_AUTH_TOKEN}

# Blynk Template Information
blynk.template-id=TMPL3qzRJhyC8
blynk.template-name=sea water monitering

# ==============================================================================
# VIRTUAL PIN ASSIGNMENTS
# Map each sensor to its corresponding Blynk Virtual Pin (e.g., v0, v1, v2, v3)
# ==============================================================================
blynk.pins.temperature=v0
blynk.pins.waste=v1
blynk.pins.humidity=v2
blynk.pins.water=v3

# Waste Detection Inversion (false = 1/HIGH is detected, true = 0/LOW is detected)
blynk.waste-inverted=false

# ==============================================================================
# SENSOR GAUGE RANGES (CONFIGURABLE)
# Note: These ranges control visual gauge boundaries without altering raw values
# ==============================================================================
# Temperature Gauge: 0 to 200 °C
blynk.gauge.temperature.min=0.0
blynk.gauge.temperature.max=200.0

# Humidity Gauge: 0 to 100 %
blynk.gauge.humidity.min=0.0
blynk.gauge.humidity.max=100.0

# Water Level Gauge: 0 to 500 mm / cm / raw
blynk.gauge.water.min=0.0
blynk.gauge.water.max=500.0

# Connection Timeout for Blynk REST API (in milliseconds)
blynk.http.connect-timeout=4000
blynk.http.read-timeout=5000

# ==============================================================================
# LOGGING
# ==============================================================================
logging.level.org.springframework.web=INFO
logging.level.com.seawater.monitoring=INFO

